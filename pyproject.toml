[project]
name = "multi-agent-data-science-team"
version = "0.2.0"
description = "Multi-agent AI data science team built with LangChain and LangGraph: a Team Leader agent delegates to six specialised agents that load, explore, clean, visualise and model tabular data."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ddgs>=9.6.1",
    "fastapi[standard]>=0.120.1",
    "langchain>=1.4.4",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.7.0",
    "langgraph>=1.2.14",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "matplotlib>=3.10.7",
    "numpy>=2.3.4",
    "pandas>=2.3.3",
    "python-dotenv>=1.2.1",
    "scikit-learn>=1.7.2",
    "seaborn>=0.13.2",
    "uvicorn>=0.38.0",
]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.33",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
